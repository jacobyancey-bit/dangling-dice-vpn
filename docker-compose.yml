name: dangling-dice-platform

services:
  # ============================================================================
  # 1. Reverse Proxy & Auto-SSL (Caddy)
  # ============================================================================
  caddy:
    image: caddy:2.8-alpine
    container_name: dangling-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - API_DOMAIN=${API_DOMAIN:-api.localhost}
      - TOOLS_DOMAIN=${TOOLS_DOMAIN:-tools.localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public-net
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      studio:
        condition: service_started

  # ============================================================================
  # 1b. Main Dangling Dice Studios™ Website Container (danglingdicestudios.duckdns.org)
  # ============================================================================
  studio:
    build:
      context: ./studio
      dockerfile: Dockerfile
    container_name: dangling-studio
    restart: unless-stopped
    networks:
      - public-net

  # ============================================================================
  # 2. Control Plane & Developer API (Go Backend)
  # ============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dangling-api
    restart: unless-stopped
    pid: "host"
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      - APP_ENV=${APP_ENV:-production}
      - API_PORT=${API_PORT:-8080}
      - SERVER_PUBLIC_IP=${SERVER_PUBLIC_IP:-127.0.0.1}
      - VPN_LISTEN_PORT=${VPN_LISTEN_PORT:-51820}
      - VPN_SUBNET=${VPN_SUBNET:-10.8.0.0/24}
      - VPN_GATEWAY_IP=${VPN_GATEWAY_IP:-10.8.0.1}
      - VPN_DNS_SERVER=${VPN_DNS_SERVER:-1.1.1.1}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-dangling_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_this_password}
      - POSTGRES_DB=${POSTGRES_DB:-dangling_dice_db}
      - REDIS_HOST=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-secret}
    volumes:
      - /etc/wireguard:/etc/wireguard
    networks:
      - public-net
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 3. Web App & Developer Tools Frontend (Next.js)
  # ============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: dangling-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${API_DOMAIN:-api.localhost}
      - NEXT_PUBLIC_SERVER_IP=${SERVER_PUBLIC_IP:-127.0.0.1}
    networks:
      - public-net
    depends_on:
      - api

  # ============================================================================
  # 4. Primary Relational Database (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: dangling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dangling_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      POSTGRES_DB: ${POSTGRES_DB:-dangling_dice_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dangling_user} -d ${POSTGRES_DB:-dangling_dice_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 5. High-Speed Cache & Ephemeral Sessions (Redis 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: dangling-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --loglevel warning;
      else
        redis-server --loglevel warning;
      fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  public-net:
    driver: bridge
  backend-net:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

